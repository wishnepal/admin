<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Support</title>
    <style>
        :root {
            --botim-green: #00C853;
            --dark-text: #2D3748;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #F7FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .confirmation-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        .order-box {
            background: #EDF2F7;
            padding: 14px;
            border-radius: 8px;
            font-weight: bold;
            margin: 20px 0;
            color: var(--dark-text);
        }
        .botim-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--botim-green);
            color: white;
            padding: 14px 24px;
            border-radius: 30px;
            font-weight: bold;
            width: 85%;
            font-size: 16px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.3);
        }
        .status-msg {
            margin-top: 10px;
            font-size: 14px;
            font-weight: bold;
            color: #2B6CB0;
            display: none;
        }
        .instructions {
            font-size: 13px;
            color: #718096;
            margin-top: 20px;
            text-align: left;
            background: #F7FAFC;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="confirmation-card">
    <h2>Order Confirmed!</h2>
    
    <div class="order-box">
        Order ID: <span id="orderId">#MW-70972</span>
    </div>

    <!-- Interactive Button -->
    <button class="botim-button" onclick="handleBotimConnect()">
        💬 Chat on Botim
    </button>
    
    <!-- Visual Confirmation Status Message -->
    <div id="statusMessage" class="status-msg">📋 Order Info Copied! Opening Botim...</div>

    <div class="instructions">
        <strong>How to connect:</strong><br>
        1. Clicking the button copies your Order ID automatically.<br>
        2. Once Botim opens, add our number <strong>+91 70972 79768</strong> and paste your message.
    </div>
</div>

<script>
function fallbackCopyText(text) {
    // Create a temporary hidden textarea element
    const textArea = document.createElement("textarea");
    textArea.value = text;
    
    // Avoid scrolling to bottom of the screen
    textArea.style.top = "0";
    textArea.style.left = "0";
    textArea.style.position = "fixed";
    textArea.style.opacity = "0";

    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();

    try {
        // Execute legacy copy command which works on all mobile platforms/HTTP protocols
        const successful = document.execCommand('copy');
        console.log('Fallback copy system status: ', successful);
    } catch (err) {
        console.error('Fallback copy strategy failed: ', err);
    }

    document.body.removeChild(textArea);
}

function handleBotimConnect() {
    const orderId = document.getElementById('orderId').innerText;
    const messageText = `Hi Support, I need help with my Order: ${orderId}`;
    
    // 1. Try modern clipboard API first
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(messageText).then(() => {
            proceedToBotim();
        }).catch(() => {
            // If browser blocks the promise, trigger bulletproof fallback
            fallbackCopyText(messageText);
            proceedToBotim();
        });
    } else {
        // Safe direct route for old browsers / HTTP connections
        fallbackCopyText(messageText);
        proceedToBotim();
    }
}

function proceedToBotim() {
    // Show visual status feedback to the user on screen
    const statusText = document.getElementById('statusMessage');
    statusText.style.display = 'block';
    
    // CRITICAL: Replace this dummy string link with your actual Botim App Invite Link string 
    // Go to: Botim App -> Profile Avatar -> Invite Friends -> Copy Link
    const myBotimInviteUrl = "https://botim.to"; 

    // Trigger redirection 
    setTimeout(() => {
        window.open(myBotimInviteUrl, '_blank');
        statusText.style.display = 'none';
    }, 800);
}
</script>

</body>
</html>
